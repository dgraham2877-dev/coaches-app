'use strict';const KEY='coaches-rebuild-1';const FORMS=['4-2-3-1','4-3-3','4-4-2','3-5-2','3-4-3','5-3-2','4-1-4-1','3-3-4'];const defaults=()=>({team:'Souths United',formation:'4-2-3-1',oppositionFormation:'4-4-2',homeColor:'#198754',awayColor:'#171717',players:Array.from({length:11},(_,i)=>({number:i+1,name:'',x:50,y:90-i*7})),opposition:Array.from({length:11},(_,i)=>({number:i+1,name:'',x:50,y:10+i*7})),notes:'',scouting:'',training:'',setpieces:'',reports:[],diagrams:[]});let data;try{data={...defaults(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data=defaults()}data.diagrams=Array.isArray(data.diagrams)?data.diagrams:[];let tab='Board',side='players',drag=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(data));$('status')&&($('status').textContent='Saved on this device')}catch(e){alert('Storage failed: '+e.message)}}function set(k,v){data[k]=v;save()}function formation(f,op=false){const rows=f.split('-').map(Number);let out=[{x:50,y:op?8:92}];const total=rows.length;rows.forEach((n,r)=>{for(let i=0;i<n;i++)out.push({x:100*(i+1)/(n+1),y:op?20+r*(54/Math.max(1,total-1)):80-r*(54/Math.max(1,total-1))})});return out.slice(0,11)}function resetPositions(op=false){const key=op?'opposition':'players';const pos=formation(data[op?'oppositionFormation':'formation'],op);data[key]=data[key].map((p,i)=>({...p,...pos[i]}));save();render()}function options(arr,val){return arr.map(x=>`<option ${x===val?'selected':''}>${esc(x)}</option>`).join('')}function field(k,title,multi=false){return `<label>${title}</label>${multi?`<textarea data-field="${k}">${esc(data[k])}</textarea>`:`<input data-field="${k}" value="${esc(data[k])}">`}`}function controls(){return `<div class="actions"><button onclick="saveDiagram()">Save tactical diagram</button><button onclick="saveReport()">Save full report</button><button onclick="exportPDF()">PDF / Print</button><button onclick="exportPPTX()">PowerPoint</button><button class="secondary" onclick="backup()">Download backup</button><label class="btn" style="margin:0">Restore backup<input type="file" accept="application/json" id="restore" style="display:none"></label></div><div class="status" id="status">Data saves automatically on this device</div>`}function pitchHTML(){const items=data[side];return `<div class="pitch" id="pitch"><div class="half"></div><div class="circle"></div><div class="area top"></div><div class="area bottom"></div>${items.map((p,i)=>`<div class="marker" data-i="${i}" style="left:${p.x}%;top:${p.y}%"><div class="shirt" style="background:${side==='players'?data.homeColor:data.awayColor}">${esc(p.number)}</div><span>${esc(p.name||('Player '+(i+1)))}</span></div>`).join('')}</div>`}function render(){const tabs=['Board','Squad','Opposition','Analysis','Training','Diagrams','Reports'];$('tabs').innerHTML=tabs.map(t=>`<button class="${tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('');let html='';if(tab==='Board')html=`<div class="layout"><section class="panel noprint"><h2>Tactical board</h2><div class="controls"><div><label>View</label><select id="side"><option value="players" ${side==='players'?'selected':''}>Our team</option><option value="opposition" ${side==='opposition'?'selected':''}>Opposition</option></select></div><div><label>Our formation</label><select data-field="formation">${options(FORMS,data.formation)}</select></div><div><label>Opposition formation</label><select data-field="oppositionFormation">${options(FORMS,data.oppositionFormation)}</select></div><div><label>Our shirt colour</label><input type="color" data-field="homeColor" value="${data.homeColor}"></div><div><label>Opposition shirt colour</label><input type="color" data-field="awayColor" value="${data.awayColor}"></div></div><div class="actions"><button onclick="resetPositions(false)">Apply our formation</button><button onclick="resetPositions(true)">Apply opposition formation</button></div><p>Drag the shirts to move players. Changes save automatically.</p>${field('notes','Tactical notes',true)}</section><section class="panel"><h2>${side==='players'?'Our team':'Opposition'} · ${esc(side==='players'?data.formation:data.oppositionFormation)}</h2>${pitchHTML()}</section></div>`;if(tab==='Squad'||tab==='Opposition'){const key=tab==='Squad'?'players':'opposition';html=`<section class="panel"><h2>${tab==='Squad'?'Our squad':'Opposition lineup'}</h2>${tab==='Squad'?field('team','Club / team'):''}<div class="controls">${data[key].map((p,i)=>`<div><label>Player ${i+1}</label><input aria-label="Number" type="number" min="0" max="99" data-player="${key}" data-index="${i}" data-prop="number" value="${esc(p.number)}"><input aria-label="Name" placeholder="Player name" data-player="${key}" data-index="${i}" data-prop="name" value="${esc(p.name)}"></div>`).join('')}</div></section>`}if(tab==='Analysis')html=`<section class="panel"><h2>Match and opposition analysis</h2>${field('scouting','Opposition scouting, strengths, weaknesses and match plan',true)}${field('notes','Tactical plan',true)}</section>`;if(tab==='Training')html=`<section class="panel"><h2>Training and set pieces</h2>${field('training','Training session plan',true)}${field('setpieces','Set-piece instructions',true)}</section>`;if(tab==='Diagrams')html=`<section class="panel"><h2>Saved tactical diagrams (${data.diagrams.length})</h2><p>Save a diagram from the Board. Each saved diagram keeps the player positions, names, colours and notes at that moment.</p>${data.diagrams.map((d,i)=>`<div class="panel"><strong>${esc(d.title)}</strong> · ${esc(d.date)}<div class="actions"><button onclick="loadDiagram(${i})">Load on board</button><button class="secondary" onclick="deleteDiagram(${i})">Delete</button></div></div>`).join('')||'No diagrams saved yet.'}</section>`;if(tab==='Reports')html=`<section class="panel"><h2>Saved reports</h2>${data.reports.length?data.reports.map((r,i)=>`<div class="panel"><strong>${esc(r.date)}</strong> · ${esc(r.team)} · ${esc(r.formation)} <button class="secondary" onclick="restoreReport(${i})">Load</button> <button class="secondary" onclick="deleteReport(${i})">Delete</button></div>`).join(''):'No reports saved yet. Use “Save full report” to create one.'}</section>`;$('page').innerHTML=html+`<section class="panel noprint">${controls()}</section>`;document.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('change',()=>{set(el.dataset.field,el.value);if(['homeColor','awayColor','formation','oppositionFormation'].includes(el.dataset.field))render()}));document.querySelectorAll('[data-player]').forEach(el=>el.addEventListener('change',()=>{data[el.dataset.player][+el.dataset.index][el.dataset.prop]=el.dataset.prop==='number'?Number(el.value):el.value;save()}));$('side')?.addEventListener('change',e=>{side=e.target.value;render()});$('pitch')?.addEventListener('pointerdown',e=>{const m=e.target.closest('.marker');if(!m)return;drag=+m.dataset.i;m.setPointerCapture(e.pointerId)});$('pitch')?.addEventListener('pointermove',e=>{if(drag===null)return;const rect=$('pitch').getBoundingClientRect();const p=data[side][drag];p.x=Math.max(7,Math.min(93,(e.clientX-rect.left)/rect.width*100));p.y=Math.max(6,Math.min(94,(e.clientY-rect.top)/rect.height*100));const m=$('pitch').querySelector(`[data-i="${drag}"]`);if(m){m.style.left=p.x+'%';m.style.top=p.y+'%'}});for(const evt of ['pointerup','pointercancel'])$('pitch')?.addEventListener(evt,()=>{if(drag!==null){drag=null;save()}});$('restore')?.addEventListener('change',restore)}$('tabs').addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render()}});function saveDiagram(){const title=prompt('Diagram name (e.g. High press vs 4-4-2):','Tactical diagram '+(data.diagrams.length+1));if(title===null)return;data.diagrams.push({title:title.trim()||'Tactical diagram',date:new Date().toLocaleString(),side,formation:data.formation,oppositionFormation:data.oppositionFormation,players:JSON.parse(JSON.stringify(data.players)),opposition:JSON.parse(JSON.stringify(data.opposition)),homeColor:data.homeColor,awayColor:data.awayColor,notes:data.notes});save();alert('Diagram saved in the Diagrams tab.')}function loadDiagram(i){const d=data.diagrams[i];if(!d)return;if(!confirm('Load this diagram onto the board?'))return;for(const k of ['formation','oppositionFormation','players','opposition','homeColor','awayColor','notes'])data[k]=JSON.parse(JSON.stringify(d[k]));side=d.side||'players';tab='Board';save();render()}function deleteDiagram(i){if(confirm('Delete this diagram?')){data.diagrams.splice(i,1);save();render()}}function snapshot(){return JSON.parse(JSON.stringify(data))}function saveReport(){data.reports.push({date:new Date().toLocaleString(),team:data.team,formation:data.formation,snapshot:{...snapshot(),reports:[]}});save();alert('Full report saved.');if(tab==='Reports')render()}function restoreReport(i){if(!confirm('Load this report? Current unsaved changes will be replaced.'))return;const reports=data.reports;data={...defaults(),...reports[i].snapshot,reports};save();render()}function deleteReport(i){if(confirm('Delete this saved report?')){data.reports.splice(i,1);save();render()}}function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function backup(){download(new Blob([JSON.stringify({app:'Coaches App Rebuild 2',data},null,2)],{type:'application/json'}),'coaches-app-backup.json')}async function restore(e){const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());const d=obj.data||obj;if(!Array.isArray(d.players)||!Array.isArray(d.opposition))throw Error('Invalid backup');if(confirm('Replace current data with this backup?')){data={...defaults(),...d};save();render()}}catch(err){alert('Restore failed: '+err.message)}}function reportPitch(d,which){const key=which==='opposition'?'opposition':'players',players=d[key]||[],color=key==='players'?d.homeColor:d.awayColor;return `<div class="pitch" style="width:100%;max-width:550px;margin:12px auto;aspect-ratio:.78"><div class="half"></div><div class="circle"></div><div class="area top"></div><div class="area bottom"></div>${players.map((p,i)=>`<div class="marker" style="left:${Number(p.x)||50}%;top:${Number(p.y)||50}%"><div class="shirt" style="background:${esc(color||'#198754')}">${esc(p.number)}</div><span>${esc(p.name||'Player '+(i+1))}</span></div>`).join('')}</div>`}function reportHTML(){const diagrams=data.diagrams.length?data.diagrams:[{title:'Current tactical board',side,players:data.players,opposition:data.opposition,homeColor:data.homeColor,awayColor:data.awayColor,notes:data.notes}];return `<h1>Coaches App — ${esc(data.team)}</h1><p>Our formation: ${esc(data.formation)} · Opposition: ${esc(data.oppositionFormation)}</p><h2>Tactical diagrams (${diagrams.length})</h2>${diagrams.map((d,i)=>`<section class="report-diagram"><h2>${i+1}. ${esc(d.title)}</h2>${reportPitch(d,d.side||'players')}<p>${esc(d.notes||'').replace(/\n/g,'<br>')}</p></section>`).join('')}<section><h2>Opposition analysis</h2><p>${esc(data.scouting).replace(/\n/g,'<br>')}</p><h2>Training</h2><p>${esc(data.training).replace(/\n/g,'<br>')}</p><h2>Set pieces</h2><p>${esc(data.setpieces).replace(/\n/g,'<br>')}</p></section>`}function exportPDF(){const w=window.open('','_blank');if(!w){alert('Allow pop-ups to print the full report.');return}w.document.write(`<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coaches App full report</title><style>${document.querySelector('style').textContent}body{background:white}.report-diagram{break-after:page;page-break-after:always;padding:12px}.report-diagram .pitch{print-color-adjust:exact;-webkit-print-color-adjust:exact}h1,h2{color:#176a4b}@media print{.report-diagram{break-after:page}}</style></head><body><main>${reportHTML()}</main></body></html>`);w.document.close();setTimeout(()=>w.print(),450)}

const xml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&quot;'}[c]));function crc32(b){let c=~0;for(const v of b){c^=v;for(let i=0;i<8;i++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(~c)>>>0}function zip(files){const enc=new TextEncoder(),parts=[],central=[];let off=0;const u16=n=>[n&255,n>>>8&255],u32=n=>[n&255,n>>>8&255,n>>>16&255,n>>>24&255];for(const [name,content] of files){const n=enc.encode(name),b=enc.encode(content),crc=crc32(b);const local=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(b.length),...u32(b.length),...u16(n.length),...u16(0),...n,...b]);parts.push(local);central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(b.length),...u32(b.length),...u16(n.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off),...n]));off+=local.length}const size=central.reduce((n,a)=>n+a.length,0);return new Blob([...parts,...central,new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(size),...u32(off),...u16(0)])],{type:'application/vnd.openxmlformats-officedocument.presentationml.presentation'})}function shape(id,text,x,y,w,h,size=18,color='172820'){return `<p:sp><p:nvSpPr><p:cNvPr id="${id}" name="Text ${id}"/><p:cNvSpPr/><p:nvPr/></p:nvSpPr><p:spPr><a:xfrm><a:off x="${x}" y="${y}"/><a:ext cx="${w}" cy="${h}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:noFill/></p:spPr><p:txBody><a:bodyPr wrap="square"/><a:lstStyle/><a:p><a:r><a:rPr lang="en-AU" sz="${size*100}"><a:solidFill><a:srgbClr val="${color}"/></a:solidFill></a:rPr><a:t>${xml(text)}</a:t></a:r><a:endParaRPr lang="en-AU"/></a:p></p:txBody></p:sp>`}function slide(title,lines){let s=shape(2,title,500000,300000,11000000,600000,30,'176A4B');let i=3,y=1150000;for(const line of lines){for(const segment of String(line).match(/.{1,95}/g)||['']){s+=shape(i++,segment,6
